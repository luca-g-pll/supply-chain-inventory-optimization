[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-inventory-optimization"
version = "1.0.0"
description = "Demand forecasting and inventory optimization: forecasts, reorder policies and a day-by-day simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luca Pillitu" }]

[project.scripts]
sciopt = "src.pipeline:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"tests/**" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
